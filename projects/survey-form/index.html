<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 12 - Survey and Feedback Form</title>
  <style>

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #89d466 0%, #96e6a1 100%);
      margin: 0;
      padding: 50px;
      color: #26d540;
    }

    h1 {
      text-align: center;
      text-decoration: underline;
      color: #2f2482;
    }

    form {
      background-color: #d2dddb;
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    form:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    fieldset {
      border: 2px solid #112a12;
      border-radius: 10px;
      margin-bottom: 25px;
      padding: 20px;
    }

    legend {
      font-weight: bold;
      color: #1b5e20;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 500;
    }

    input, textarea, select {
      width: 95%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #440202;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #43a047;
      box-shadow: 0 0 10px rgba(67, 160, 71, 0.3);
    }

    textarea {
      resize: none;
    }

    .input rate {
      width: auto;
      margin-right: 5px;
    }

    .bhoo {
      text-align: center;
      margin-top: 20px;
    }

    .bit {
      background-color: #43a047;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      margin: 0 10px;
    }

    .bit:hover {
      background-color: #2e7d32;
      transform: scale(1.05);
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #444;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Lab 12 - Survey and Feedback Form</h1>

  <form>
    <fieldset>
      <legend>Personal Information</legend>

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="10" max="120" required>

      <label>Gender:</label>
      <label for="male" style="display:inline;">Male</label>
      <input type="radio" id="male" name="gender" value="Male">
      <label for="female" style="display:inline;">Female</label>
      <input type="radio" id="female" name="gender" value="Female">
      <label for="other" style="display:inline;">Other</label>
      <input type="radio" id="other" name="gender" value="Other">

    </fieldset>

    <fieldset>
      <legend>Rate Your Experience</legend>
      <div class="rate">
        <label>How satisfied are you with our services?</label>
       1 <input type="radio" name="rate" value="1"> 
       2 <input type="radio" name="rate" value="2"> 
       3 <input type="radio" name="rate" value="3"> 
       4 <input type="radio" name="rate" value="4"> 
       5 <input type="radio" name="rate" value="5"> 
      </div>
    </fieldset>

    <fieldset>
      <legend>Feedback and Suggestions</legend>

      <label for="feedback">Your Feedback:</label>
      <textarea id="feedback" name="feedback" rows="4" placeholder="Share your experience..."></textarea>

      <label for="experience">How can we improve your experience?</label>
      <textarea id="experience" name="experience" rows="3" placeholder="Write your suggestions..."></textarea>
    </fieldset>

    <div class="bhoo">
      <input type="submit" value="Submit" class="bit">
      <input type="reset" value="Reset" class="bit" style="background-color: #b0bec5; color: black;">
    </div>
  </form>

  <footer>
    © 2025 Web Designing Lab | Created by Asees Jot Singh
  </footer>

</body>
</html>
